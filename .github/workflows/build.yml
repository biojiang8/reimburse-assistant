name: Build Installers

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.platform }} / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            target: aarch64-apple-darwin
            bundles: app,dmg
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python engine dependencies
        run: pip install pyinstaller PyMuPDF Pillow openpyxl python-docx

      - name: Build Python engine (PyInstaller)
        shell: bash
        run: |
          cd src-tauri/helpers
          if [[ "$RUNNER_OS" == "Windows" ]]; then SEP=";"; else SEP=":"; fi
          pyinstaller --onedir --name reimburse-helper --clean --noconfirm \
            --exclude-module pandas \
            --exclude-module scipy \
            --exclude-module matplotlib \
            --exclude-module contourpy \
            --exclude-module kiwisolver \
            --exclude-module fontTools \
            --exclude-module dateutil \
            --exclude-module pytz \
            --add-data "add_invoice_signature.py${SEP}." \
            --add-data "reagent_report.py${SEP}." \
            --add-data "invoice_summary.py${SEP}." \
            --add-data "invoice_evidence.py${SEP}." \
            --add-data "verify_package.py${SEP}." \
            helper_cli.py
          cp -R dist/reimburse-helper .
          rm -rf build dist *.spec

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build Tauri app
        run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Normalize artifact names (ASCII)
        shell: bash
        run: |
          cd src-tauri/target/${{ matrix.target }}/release/bundle
          find . -name "报销助手_*" -type f | while read -r f; do
            mv "$f" "$(dirname "$f")/$(basename "$f" | sed 's/^报销助手/reimburse-assistant/')"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: reimburse-assistant-${{ matrix.platform }}-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
